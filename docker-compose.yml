services:
  # --------------------------------------------------------
  # Produção: build multi-stage + servidor SSR do Nuxt
  #   docker compose up -d --build
  # --------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    image: encomp-app:latest
    container_name: encomp-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --------------------------------------------------------
  # Desenvolvimento com hot reload:
  #   docker compose --profile dev up dev
  # --------------------------------------------------------
  dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: encomp-app-dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NUXT_TELEMETRY_DISABLED: "1"
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
